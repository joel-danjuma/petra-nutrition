name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        # pgvector's image, not plain postgres:15. Recipe embeddings are a
        # vector(384) column with an HNSW index, so `prisma migrate deploy`
        # below runs `CREATE EXTENSION vector` and fails without it.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petra_ai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # The agent's Prisma schema is generated from the API's, so a schema change
    # the agent hasn't absorbed fails the pull request that introduced it —
    # rather than failing at chat time, in production, for the first user who
    # asks a question.
    - name: Check the agent's read model is in sync with the API schema
      run: pnpm --filter @petra/agent run sync-schema:check

    - name: Generate Prisma clients
      run: |
        pnpm --filter @petra/api run db:generate
        pnpm --filter @petra/agent run db:generate

    - name: Run linting
      run: pnpm run lint

    - name: Run type checking
      run: pnpm run type-check

    - name: Setup test database
      run: pnpm --filter @petra/api exec prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petra_ai_test

    # Proves the agent's projected read model actually matches the migrated
    # database, not just the schema file it was generated from.
    - name: Verify the agent's read model against the migrated database
      run: pnpm --filter @petra/agent exec tsx -e "import('./src/db').then(m => m.connectDatabase()).then(() => process.exit(0))"
      env:
        AGENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petra_ai_test
        GROQ_API_KEY: test-key-not-used-for-this-check

    - name: Run API tests
      run: pnpm --filter @petra/api test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petra_ai_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret
        AGENT_URL: http://localhost:3002
        NODE_ENV: test

    - name: Run agent tests
      run: pnpm --filter @petra/agent test

    # Both services read back what the other wrote — the importer writes
    # amount/unit and the nutrition node turns them into grams — so a
    # regression here makes the recipe screen and the macro panel disagree.
    - name: Run food-measures tests
      run: pnpm --filter @petra/food-measures test

    - name: Run shared package tests
      run: pnpm --filter @petra/shared test

    - name: Run web frontend tests
      run: pnpm --filter @petra/web test
      env:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./services/api/coverage/lcov.info,./services/agent/coverage/lcov.info,./apps/web/coverage/lcov.info
        fail_ci_if_error: true

  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    # One job per deployable. The whole point of the split is that these three
    # release independently; a shared job would put them back on one cadence.
    strategy:
      fail-fast: false
      matrix:
        service: [api, agent, web]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service: [api, agent, web]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
        format: 'sarif'
        output: 'trivy-${{ matrix.service }}.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-${{ matrix.service }}.sarif'
        category: ${{ matrix.service }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.petra-ai.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /opt/petra-ai
          git pull origin develop
          ./scripts/deploy.sh --environment staging --skip-tests

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://petra-ai.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to production server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          cd /opt/petra-ai
          git pull origin main
          ./scripts/deploy.sh --environment production --skip-tests

    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: '🚀 Petra AI has been successfully deployed to production!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  mobile-build:
    name: Build Mobile App
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'

    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    # Installed from the workspace root: Expo's tooling needs the hoisted tree
    # this repo configures (see shamefullyHoist in pnpm-workspace.yaml).
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build for EAS
      run: |
        cd apps/mobile
        eas build --platform all --non-interactive
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  mobile-deploy:
    name: Deploy Mobile App
    runs-on: ubuntu-latest
    needs: mobile-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: mobile-stores

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: Submit to App Stores
      run: |
        cd apps/mobile
        eas submit --platform all --non-interactive
      env:
        EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
        EXPO_APPLE_PASSWORD: ${{ secrets.EXPO_APPLE_PASSWORD }}

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy-staging, deploy-production]
    if: failure()

    steps:
    - name: Notify failure
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: '❌ Petra AI CI/CD pipeline failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
