packages:
  - 'packages/*'
  - 'services/*'
  - 'apps/*'
# React Native / Expo's tooling (Metro, various native module packages)
# assumes a flat, npm/yarn-style node_modules tree and doesn't reliably
# resolve pnpm's strict, symlinked dependency isolation. Hoisting
# everything to the root node_modules is the standard workaround.
# See: https://docs.expo.dev/guides/monorepos/
shamefullyHoist: true
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # protobufjs ships a postinstall that regenerates its descriptors; nothing
  # here imports it directly (it arrives under the Expo toolchain) so it does
  # not need to run.
  protobufjs: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26'
  - '@expo/ui@57.0.19'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo-router@57.0.22
  - expo@57.0.24
  - '@expo/metro-runtime@57.0.16'
  - expo-image-picker@57.0.19
  - expo-notifications@57.0.20
